# Production-like stack: PostgreSQL + Campus LMS Lite.
# Usage: copy .env.example to .env, set POSTGRES_PASSWORD and APP_URL, then `docker compose up -d --build`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lms:${POSTGRES_PASSWORD}@db:5432/lms
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Campus LMS Lite <no-reply@example.edu>}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3000:3000" # put a TLS-terminating reverse proxy in front

volumes:
  pgdata:
  uploads:
